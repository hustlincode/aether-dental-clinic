      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#A1A1AA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0"/>
