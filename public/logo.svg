<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" role="img" aria-labelledby="aether-logo-title aether-logo-desc">
  <title id="aether-logo-title">Aether Dental logo</title>
  <desc id="aether-logo-desc">A gold tooth monogram with an A-shaped cutout, inside a broken orbit ring with a single node.</desc>
  <defs>
    <linearGradient id="aether-gold" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6C76B"/>
      <stop offset="0.55" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8912A"/>
    </linearGradient>
  </defs>

  <!-- Orbit: a quiet ink halo keeps the gold legible on light surfaces; the
       gold arc carries the brand on dark surfaces. -->
  <g fill="none" stroke-linecap="round" transform="rotate(-12 32 32)">
    <circle cx="32" cy="32" r="25.25" stroke="#0E0F10" stroke-opacity="0.10" stroke-width="2.8" stroke-dasharray="142.65 16"/>
    <circle cx="32" cy="32" r="25.25" stroke="url(#aether-gold)" stroke-width="1.35" stroke-dasharray="142.65 16"/>
  </g>

  <!-- The node marks the booking point in the orbit. -->
  <circle cx="53.8" cy="19.3" r="2.25" fill="url(#aether-gold)" stroke="#0E0F10" stroke-opacity="0.16" stroke-width="0.9"/>

  <!-- Tooth silhouette. The upper counter is cut out in the shape of an A;
       the roots split below, repeating the letterform. -->
  <path
    fill="url(#aether-gold)"
    fill-rule="evenodd"
    stroke="#0E0F10"
    stroke-opacity="0.22"
    stroke-width="1.1"
    stroke-linejoin="round"
    d="M32 14.2C30.7 12.8 28.9 12 26.9 12.1C23.9 12.2 21.6 13.9 20.2 16.4C18.7 19.1 18.2 22.2 18.8 25.4C19.4 28.5 20.6 31.4 21.7 34.7C22.9 38.2 23.8 41.8 24.6 45.2C25.3 48.3 26.4 50.4 28.6 50.4C30.2 50.4 31 48.7 31.6 46.5C31.8 45.6 31.9 44.7 32 43.8C32.1 44.7 32.2 45.6 32.4 46.5C33 48.7 33.8 50.4 35.4 50.4C37.6 50.4 38.7 48.3 39.4 45.2C40.2 41.8 41.1 38.2 42.3 34.7C43.4 31.4 44.6 28.5 45.2 25.4C45.8 22.2 45.3 19.1 43.8 16.4C42.4 13.9 40.1 12.2 37.1 12.1C35.1 12 33.3 12.8 32 14.2ZM32 19.2C31 19.2 30.2 19.9 29.9 20.8L26.2 30.9C25.8 32.2 26.7 33.5 28.1 33.5H35.9C37.3 33.5 38.2 32.2 37.8 30.9L34.1 20.8C33.8 19.9 33 19.2 32 19.2Z"
  />
</svg>
